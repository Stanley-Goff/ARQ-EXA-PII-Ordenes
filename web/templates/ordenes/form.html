{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ titulo }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="acciones">
      <button class="btn" type="submit">Guardar</button>
      <a class="btn sec" href="{{ cancelar }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
