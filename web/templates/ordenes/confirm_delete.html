{% extends "base.html" %}
{% block title %}Confirmar eliminación{% endblock %}
{% block content %}
<div class="card">
  <h1>Confirmar eliminación</h1>
  <p>{{ mensaje }}</p>
  <form method="post">
    {% csrf_token %}
    <div class="acciones">
      <button class="btn peligro" type="submit">Sí, eliminar</button>
      <a class="btn sec" href="{{ cancelar }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
