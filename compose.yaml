name: grupo1-ordenes

services:
  # ---------------------------------------------------------------- Base de datos
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en el archivo .env}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # mssql-tools18 en las imagenes recientes; mssql-tools en las antiguas.
      test:
        - CMD-SHELL
        - >-
          S=/opt/mssql-tools18/bin/sqlcmd; [ -x "$$S" ] || S=/opt/mssql-tools/bin/sqlcmd;
          "$$S" -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    networks:
      - ordenes_net
    restart: unless-stopped

  # ------------------------------------------- Inicializacion (ejecuta db/init.sql)
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./db/init.sql:/init.sql:ro,z
    command:
      - /bin/bash
      - -c
      - >-
        S=/opt/mssql-tools18/bin/sqlcmd; [ -x "$$S" ] || S=/opt/mssql-tools/bin/sqlcmd;
        "$$S" -C -S db -U sa -P "$$MSSQL_SA_PASSWORD" -b -i /init.sql
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    networks:
      - ordenes_net
    restart: "no"

  # ---------------------------------------------------------------------- API Flask
  api:
    build: ./api
    image: ${DOCKERHUB_USER:-usuario}/ordenes-api:v1.0
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: OrdenesDB
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - ordenes_net
    restart: unless-stopped

  # -------------------------------------------------------------- Frontend Django
  web:
    build: ./web
    image: ${DOCKERHUB_USER:-usuario}/ordenes-web:v1.0
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:5000
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cambiar-esta-clave-en-el-env}
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - ordenes_net
    restart: unless-stopped

networks:
  ordenes_net:
    driver: bridge

volumes:
  sqlserver_data:
